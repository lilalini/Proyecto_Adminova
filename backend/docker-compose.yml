services:
  db:
    image: postgres:15-alpine
    container_name: adminova_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: adminova_db_copia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 3155
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - adminova_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adminova_backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: adminova_db_copia
      DB_USERNAME: postgres
      DB_PASSWORD: 3155
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    networks:
      - adminova_network
    command: php artisan serve --host=0.0.0.0 --port=8000

volumes:
  pgdata:

networks:
  adminova_network:
    driver: bridge
