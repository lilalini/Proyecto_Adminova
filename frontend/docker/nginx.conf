server {
    listen 80;
    server_name adminova.es;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name adminova.es;

    ssl_certificate /etc/ssl/certs/adminova.crt;
    ssl_certificate_key /etc/ssl/private/adminova.key;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
