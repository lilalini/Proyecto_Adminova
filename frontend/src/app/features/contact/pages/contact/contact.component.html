<div class="min-h-screen bg-gray-50 py-12">
  <div class="max-w-3xl mx-auto px-4">

    <div class="mb-8">
      <h1 class="text-3xl font-bold text-gray-900">Contacto</h1>
      <p class="text-gray-500 mt-2">¿Tienes alguna pregunta? Estaremos encantados de ayudarte.</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">

      <!-- Info contacto -->
      <div class="space-y-6">
        <div class="bg-white rounded-xl border border-gray-200 p-6">
          <div class="flex items-center gap-3 mb-2">
            <app-icon-svg name="mail" className="w-5 h-5 text-indigo-600"></app-icon-svg>
            <h3 class="font-semibold text-gray-800">Email</h3>
          </div>
          <p class="text-gray-500 text-sm">info&#64;adminova.com</p>
        </div>

        <div class="bg-white rounded-xl border border-gray-200 p-6">
          <div class="flex items-center gap-3 mb-2">
            <app-icon-svg name="phone" className="w-5 h-5 text-indigo-600"></app-icon-svg>
            <h3 class="font-semibold text-gray-800">Teléfono</h3>
          </div>
          <p class="text-gray-500 text-sm">+34 900 123 456</p>
        </div>

        <div class="bg-white rounded-xl border border-gray-200 p-6">
          <div class="flex items-center gap-3 mb-2">
            <app-icon-svg name="clock" className="w-5 h-5 text-indigo-600"></app-icon-svg>
            <h3 class="font-semibold text-gray-800">Horario</h3>
          </div>
          <p class="text-gray-500 text-sm">Lun - Vie: 9:00 - 18:00</p>
        </div>
      </div>

      <!-- Formulario -->
      <div class="md:col-span-2">
        <div class="bg-white rounded-xl border border-gray-200 p-6">

          @if (successMessage) {
            <div class="bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg mb-6">
              {{ successMessage }}
            </div>
          }

          @if (errorMessage) {
            <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-6">
              {{ errorMessage }}
            </div>
          }

          <form (ngSubmit)="onSubmit()">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                  Nombre <span class="text-red-500">*</span>
                </label>
                <input type="text" [(ngModel)]="formData.name" name="name"
                       placeholder="Tu nombre"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-300">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                  Email <span class="text-red-500">*</span>
                </label>
                <input type="email" [(ngModel)]="formData.email" name="email"
                       placeholder="tu@email.com"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-300">
              </div>
            </div>

            <div class="mb-4">
              <label class="block text-sm font-medium text-gray-700 mb-1">Asunto</label>
              <input type="text" [(ngModel)]="formData.subject" name="subject"
                     placeholder="¿En qué podemos ayudarte?"
                     class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-300">
            </div>

            <div class="mb-6">
              <label class="block text-sm font-medium text-gray-700 mb-1">
                Mensaje <span class="text-red-500">*</span>
              </label>
              <textarea [(ngModel)]="formData.message" name="message" rows="5"
                        placeholder="Escribe tu mensaje aquí..."
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-300"></textarea>
            </div>

            <button type="submit" [disabled]="sending"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-lg transition disabled:opacity-50 flex items-center justify-center gap-2">
              @if (sending) {
                <div class="animate-spin rounded-full h-5 w-5 border-2 border-white border-t-transparent"></div>
                <span>Enviando...</span>
              } @else {
                <app-icon-svg name="send" className="w-5 h-5"></app-icon-svg>
                <span>Enviar mensaje</span>
              }
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
